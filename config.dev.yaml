# Usage: README.md "Quick start". Every key: docs/config-schema.yaml.

kafka:
  brokers:
    - "localhost:19092"
  group_id: "dfe-archiver-dev"
  topics:
    - "test-events"
  batch_size: 1000

archive:
  destination: "file://./data/archive"
  path_template: "{year}/{month}/{day}/{hour}"
  file_extension: "jsonl"
  roll_size_bytes: 1073741824
  roll_interval_secs: 3600

buffer:
  flush_bytes: 1048576
  flush_age_secs: 5
  flush_records: 1000
  writer_parallelism: 2
  spool_dir: "./data/spool"

routing:
  mode: "expression"
  expression_fields:
    - "_org_id"
  default_segment: "default"

compression:
  codec: "zstd"
  level: 3
  enabled: true
