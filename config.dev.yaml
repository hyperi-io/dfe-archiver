# Project:      dfe-archiver
# File:         config.dev.yaml
# Purpose:      Development configuration for local testing
# Language:     YAML
#
# License:      BUSL-1.1
# Copyright:    (c) 2026 HyperI Pty Ltd
#
# Usage:
#   ARCHIVER_CONFIG=config.dev.yaml cargo run
#
# Requires:
#   docker compose -f docker-compose.dev.yaml up -d

kafka:
  brokers:
    - "localhost:19092"
  group_id: "dfe-archiver-dev"
  topics:
    - "test-events"
  batch_size: 1000
  # No SASL for local Redpanda

archive:
  # Local file destination for dev
  destination: "file://./data/archive"
  path_template: "{topic}/{year}/{month}/{day}/{hour}"
  file_extension: "jsonl"
  # Rolling triggers (on FINAL compressed file size)
  roll_size_bytes: 1073741824    # 1GB final file size
  roll_interval_secs: 3600       # 1 hour

  # MinIO config (uncomment to test S3-compatible storage)
  # destination: "minio://archive"
  # minio:
  #   endpoint: "http://localhost:9000"
  #   access_key: "minioadmin"
  #   secret_key: "minioadmin"
  #   bucket: "archive"
  #   use_ssl: false

buffer:
  # Smaller buffers for dev (faster feedback)
  flush_bytes: 1048576           # 1MB
  flush_age_secs: 5              # 5 seconds
  flush_records: 1000
  writer_parallelism: 2

# The memory guard is scalo's and is configured by env, not from this file:
#   ARCHIVER_MEMORY_LIMIT_BYTES (0 = auto-detect from the cgroup)
#   ARCHIVER_MEMORY_PRESSURE_THRESHOLD
#   ARCHIVER_MEMORY_CGROUP_HEADROOM

routing:
  mode: "expression"
  expression_fields:
    - "org_id"
  default_segment: "unknown"
  # Uncomment for topic-based routing:
  # mode: "topic"

compression:
  codec: "zstd"
  level: 3
  enabled: true

# The metrics listener and the scaling-pressure engine are scalo's, built
# before this file is read. Their settings come from the config cascade, which
# discovers config files by name (settings.yaml) and cannot ingest an arbitrary
# --config path, so set them by env instead:
#
#   --metrics-addr / METRICS_ADDR / ARCHIVER_METRICS__ADDRESS
#   ARCHIVER_SCALING__ENABLED
#   ARCHIVER_SCALING__MEMORY_GATE_THRESHOLD   (0.0-1.0; forces pressure to 100)
#
# The composite KEDA scales on is the weighted kafka_lag + buffer_depth +
# memory set in scaling_components(), gated by the object-store circuit, and
# reaches KEDA as the dfe_scaling_pressure gauge on /metrics.
