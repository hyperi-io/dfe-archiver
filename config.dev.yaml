# Project:      dfe-archiver
# File:         config.dev.yaml
# Purpose:      Development configuration for local testing
# Language:     YAML
#
# License:      BUSL-1.1
# Copyright:    (c) 2026 HyperI Pty Ltd
#
# Usage:
#   ARCHIVER_CONFIG=config.dev.yaml cargo run
#
# Requires:
#   docker compose -f docker-compose.dev.yaml up -d

kafka:
  brokers:
    - "localhost:19092"
  group_id: "dfe-archiver-dev"
  topics:
    - "test-events"
  batch_size: 1000
  # No SASL for local Redpanda

archive:
  # Local file destination for dev
  destination: "file://./data/archive"
  path_template: "{topic}/{year}/{month}/{day}/{hour}"
  file_extension: "jsonl"
  # Rolling triggers (on FINAL compressed file size)
  roll_size_bytes: 1073741824    # 1GB final file size
  roll_interval_secs: 3600       # 1 hour

  # MinIO config (uncomment to test S3-compatible storage)
  # destination: "minio://archive"
  # minio:
  #   endpoint: "http://localhost:9000"
  #   access_key: "minioadmin"
  #   secret_key: "minioadmin"
  #   bucket: "archive"
  #   use_ssl: false

buffer:
  # Smaller buffers for dev (faster feedback)
  flush_bytes: 1048576           # 1MB
  flush_age_secs: 5              # 5 seconds
  flush_records: 1000
  writer_parallelism: 2

memory:
  limit_bytes: 67108864          # 64MB
  pressure_threshold: 0.8
  tracking_enabled: true

routing:
  mode: "expression"
  expression_fields:
    - "org_id"
  default_segment: "unknown"
  # Uncomment for topic-based routing:
  # mode: "topic"

compression:
  codec: "zstd"
  level: 3
  enabled: true

metrics:
  enabled: true
  address: "0.0.0.0:9090"
  path: "/metrics"

# Horizontal scaling-pressure engine (rustlib 2.8.11). Honoured via the config
# cascade -- run_app's guarded config::setup() ingests this --config file into
# rustlib's global singleton, and the ScalingEngine reads `scaling.*` from it.
# Emits dfe-archiver_scaling_pressure{name="default"} for a KEDA Prometheus
# trigger. The smart default = max(CPU/cpu_target, kafka inbound) gated by the
# object-store circuit. Inbound = Kafka (per-pod assigned-partition lag, pushed
# from the consume loop); outbound = object store (NOT a rustlib transport, so
# the outbound term is emit-only and never in the default composite).
scaling:
  enabled: true
  interval_secs: 15
  transport:
    inbound: kafka
    outbound: other        # s3/gcs/azure object store -- not a rustlib transport
  params:
    cpu_target: 0.70
    # lag_target is PER-POD: sustained_msgs_per_sec_per_pod * tolerable_backlog_seconds
    # (KEDA lagThreshold semantics). LEFT UNSET deliberately -- with no measured
    # per-pod archiver throughput it would be a guess, and a wrong value
    # mis-scales. Until then the Kafka lag term contributes 0 and the default
    # reduces to CPU-only (+ circuit gate). TUNE-ME: set once a real per-pod
    # sustained ingest rate is known.
    # lag_target: 50000
