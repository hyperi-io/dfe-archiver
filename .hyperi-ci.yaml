#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.
classification: product

# Project language (auto-detected if not specified)
# Values: python, typescript, golang, rust, none
language: rust

# Quality checks
quality:
  enabled: true
  # cargo-audit and osv-scanner do not read deny.toml, so its accepted advisories repeat here.
  ignore:
    - tool: cargo-audit
      id: RUSTSEC-2026-0387
      reason: "crypto-bigint 0.5.5 via the aws-sdk-s3 dev-dependency only, in no shipped binary. No 0.5 fix exists and aws-sigv4 1.6.3 still requires ^0.5.4. Mirrors the deny.toml ignore."
    - tool: osv-scanner
      id: RUSTSEC-2026-0387
      reason: "crypto-bigint 0.5.5 via the aws-sdk-s3 dev-dependency only, in no shipped binary. No 0.5 fix exists and aws-sigv4 1.6.3 still requires ^0.5.4. Mirrors the deny.toml ignore."
  rust:
    fmt: blocking           # Formatting check (cargo fmt --check)
    clippy: blocking        # Linting (cargo clippy)
    audit: blocking         # Security audit (cargo audit)
    deny: blocking          # License/advisory check (cargo deny)
    # Feature sets to test with clippy (jemalloc-only per 2026-04-17 DFE policy)
    features:
      - "default"
      - "jemalloc"

# Testing
test:
  enabled: true
  coverage: true
  # min_coverage: 80       # Fail if coverage below this percentage
  rust:
    tier: all               # "unit", "integration", "e2e", or "all"
    # Feature sets to test (match quality.rust.features for consistency)
    features:
      - "default"
      - "jemalloc"

# Building
build:
  enabled: true
  strategies:
    - native
  rust:
    glibc_max: "2.41"
    optimize:
      pgo:
        # Built before the workload clock starts: an uncached arm64 runner takes longer than the workload timeout to compile it.
        workload_setup_cmd: "cargo build --release --features pgo-driver --bin pgo-driver"
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    # Feature sets to build (production builds use jemalloc)
    features:
      - "jemalloc"

# Releasing
release:
  enabled: true
  # Keep `library` at the scalo version in Cargo.toml: the library renders only the contract version its scalo release writes.
  helm:
    enabled: true
    contract: emit
    library: "2.14.20"
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
