#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

# Project language (auto-detected if not specified)
# Values: python, typescript, golang, rust, none
language: rust

# Runner settings (override GH_RUNNER_* variables)
runners:
  default: arc-native-16cpu    # Default runner for all jobs (quality, test, build, publish)

# Quality checks
quality:
  enabled: true
  rust:
    fmt: blocking           # Formatting check (cargo fmt --check)
    clippy: blocking        # Linting (cargo clippy)
    audit: warn             # Security audit (cargo audit) - warn only
    deny: warn              # License/advisory check (cargo deny)
    # Feature sets to test with clippy (jemalloc-only per 2026-04-17 DFE policy)
    features:
      - "default"
      - "jemalloc"

# Testing
test:
  enabled: true
  coverage: true
  # min_coverage: 80       # Fail if coverage below this percentage
  rust:
    tier: all               # "unit", "integration", "e2e", or "all"
    # Feature sets to test (match quality.rust.features for consistency)
    features:
      - "default"
      - "jemalloc"

# Building
build:
  enabled: true
  type: app                # Build binaries (not just crate)
  strategies:
    - native
  rust:
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    # Feature sets to build (production builds use jemalloc)
    features:
      - "jemalloc"
    # Channel-tiered release optimisation (hyperi-ci v1.12.1+).
    # spike/alpha:    Tier 1 — jemalloc + thin LTO        (~4 min/arch)
    # beta:           Tier 1 — jemalloc + fat LTO         (~10 min/arch)
    # release:        Tier 2 — Tier 1 + PGO + BOLT        (~26 min/arch)
    optimize:
      pgo:
        enabled: true
        # Workload script must drive the actual hot path (consume → batch
        # → compress → write) for ≥60s. Single-request curls or port-poll
        # scripts produce NEGATIVE PGO gains. See dfe-loader Canary 2 +
        # dfe-receiver Canary 1 lessons in TODO.md.
        workload_cmd: "bash scripts/pgo-workload.sh"
        duration_secs: 300
      bolt:
        enabled: true       # Linux-only, +5-15% on top of PGO. Requires pgo.

# Publishing (on release)
publish:
  enabled: true
  target: both
  binaries: both
  container:
    enabled: true
    registry: ghcr
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
