# Project:      dfe-archiver
# File:         Cargo.toml
# Purpose:      Workspace root for high-volume Kafka-to-storage archiver
# Language:     TOML
#
# License:      BUSL-1.1
# Copyright:    (c) 2026 HYPERI PTY LIMITED

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/io",
    "crates/archiver",
]

[workspace.package]
# hyperi-ci stamps the release version onto this key at build time and the
# member crates inherit it, so the committed value is never a release number.
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-archiver"
authors = ["HYPERI PTY LIMITED <engineering@hyperi.io>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
panic = "warn"
# Types keep descriptive names even where the module path repeats them, so call sites read without it.
module_name_repetitions = "allow"
# #[must_use] goes where dropping the value is a bug, not on every pure function.
must_use_candidate = "allow"
# Counts and byte totals become f64 metric values, which are exact below 2^53.
cast_precision_loss = "allow"

[workspace.dependencies]
# Internal crates
dfe-archiver-core = { path = "crates/core" }
dfe-archiver-io = { path = "crates/io" }

# The floor moves with `release.helm.library` in .hyperi-ci.yaml.
scalo = { version = "2.14.29" }

# Config-schema derivation. Same range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.3, <2", default-features = false, features = ["std", "derive", "preserve_order"] }

# Async runtime
tokio = { version = ">=1.54.1, <2", features = ["full", "parking_lot"] }
tokio-util = { version = ">=0.7.20, <0.8", features = ["time"] }

# Serialization
serde = { version = ">=1.0.229, <2", features = ["derive"] }
serde_json = ">=1.0.154, <2"
sonic-rs = ">=0.5.10, <0.6"

# Error handling
thiserror = ">=2.0.21, <3"
anyhow = ">=1.0.104"

# Compression
zstd = ">=0.14.3, <0.15"
lz4_flex = ">=0.14.0, <0.15"
snap = ">=1.1.2, <2"
flate2 = ">=1.1.10, <2"

# Cloud storage backends
object_store = { version = ">=0.14.2, <0.15", features = ["aws", "gcp", "azure"] }
# The e2e MinIO fixture's client only. Default features off drops the legacy
# `rustls` feature and its unmaintained rustls-webpki, so the rest are re-listed.
aws-sdk-s3 = { version = ">=1.157.0, <2", default-features = false, features = [
    "default-https-client",
    "http-1x",
    "rt-tokio",
    "sigv4a",
] }

# Utilities
bytes = ">=1.12.1, <2"
chrono = { version = ">=0.4.45, <0.5", features = ["serde"] }
uuid = { version = ">=1.29.0, <2", features = ["v4", "serde"] }
parking_lot = ">=0.13.0, <0.14"
rayon = ">=1.12, <2"
dashmap = ">=6.2.1, <7"
compact_str = ">=0.10, <0.11"
rustc-hash = ">=2.1.3, <3"
smallvec = { version = ">=1.16.4, <2", features = ["union", "serde"] }
fs2 = ">=0.4.3, <0.5"
indexmap = ">=2.14.2, <3"
lru = ">=0.19.0, <0.20"
metrics = ">=0.24.4, <0.25"
percent-encoding = ">=2.3.2, <3"

# CLI
clap = { version = ">=4.6.7, <5", features = ["derive", "env"] }

# Tracing
tracing = ">=0.1.44, <0.2"
tracing-subscriber = { version = ">=0.3.23, <0.4", features = ["env-filter"] }

# Async utilities
async-trait = ">=0.1.92, <0.2"
futures = ">=0.3.34, <0.4"

# Config
dotenvy = ">=0.15.7, <0.16"

# The -ctl half gives scalo's memory guard its live heap bytes.
tikv-jemallocator = ">=0.7.0, <0.8"
tikv-jemalloc-ctl = { version = ">=0.7.0, <0.8", features = ["stats"] }

# Dev dependencies
tempfile = ">=3.27, <4"
# Scoped env-var set/restore without the workspace-forbidden `unsafe`.
temp-env = ">=0.3.6, <0.4"
criterion = { version = ">=0.8.2, <0.9", features = ["html_reports", "async_tokio"] }
proptest = ">=1.12.0, <2"
tokio-test = ">=0.4.6, <0.5"
test-log = { version = ">=0.2.21, <0.3", features = ["trace"] }
walkdir = ">=2.5, <3"
reqwest = ">=0.13.5, <0.14"
rdkafka = { version = ">=0.39, <0.40", features = ["dynamic-linking"] }
# Same major line as the other DFE apps, so the container-hygiene helpers match.
testcontainers = ">=0.28.0, <0.29"
# Azure Shared Key signing, to create the blob container object_store cannot.
hmac = ">=0.13, <0.14"
sha2 = ">=0.11.1, <0.12"
base64 = ">=0.23.1, <0.24"

[profile.release]
lto = "thin"             # hyperi-ci overrides to "fat" at beta+ channels
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
