# Project:      dfe-archiver
# File:         Cargo.toml
# Purpose:      Workspace root for high-volume Kafka-to-storage archiver
# Language:     TOML
#
# License:      FSL-1.1-ALv2
# Copyright:    (c) 2026 HyperI Pty Ltd

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/io",
    "crates/archiver",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "FSL-1.1-ALv2"
repository = "https://github.com/hyperi-io/dfe-archiver"
authors = ["HyperI Pty Ltd <engineering@hyperi.io>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"

[workspace.dependencies]
# Internal crates
dfe-archiver-core = { path = "crates/core" }
dfe-archiver-io = { path = "crates/io" }

# HyperI shared library
hyperi-rustlib = { version = ">=2.6.1" }

# Async runtime
tokio = { version = ">=1.50", features = ["full", "parking_lot"] }
tokio-util = { version = ">=0.7", features = ["time"] }

# Serialization
serde = { version = ">=1.0.228", features = ["derive"] }
serde_json = ">=1.0.149"
sonic-rs = ">=0.5.8"

# Error handling
thiserror = ">=2.0"
anyhow = ">=1.0.100"

# Compression
zstd = ">=0.13"
lz4_flex = ">=0.13"
snap = ">=1.1"
flate2 = ">=1.1.9"

# Cloud storage backends
object_store = { version = ">=0.13", features = ["aws", "gcp", "azure"] }
aws-config = ">=1.8"
aws-sdk-s3 = ">=1.124"

# Utilities
bytes = ">=1.11"
chrono = { version = ">=0.4.44", features = ["serde"] }
uuid = { version = ">=1.23", features = ["v4", "serde"] }
parking_lot = ">=0.12"
rayon = ">=1.12"
dashmap = ">=6.1"
compact_str = ">=0.9"
rustc-hash = ">=2.1"
smallvec = { version = ">=1.15", features = ["union", "serde"] }
fs2 = ">=0.4"
indexmap = ">=2.14"
lru = ">=0.16"
metrics = ">=0.24.4"
percent-encoding = ">=2.3"

# CLI
clap = { version = ">=4.6", features = ["derive", "env"] }

# Tracing
tracing = ">=0.1.44"
tracing-subscriber = { version = ">=0.3.23", features = ["env-filter"] }

# Async utilities
async-trait = ">=0.1.89"
futures = ">=0.3.32"

# Config
dotenvy = ">=0.15"
serde_yaml_ng = ">=0.9"

# Allocators
tikv-jemallocator = ">=0.6"

# Dev dependencies
tempfile = ">=3.27"
criterion = { version = ">=0.8", features = ["html_reports", "async_tokio"] }
proptest = ">=1.11"
tokio-test = ">=0.4"
test-log = { version = ">=0.2", features = ["trace"] }
walkdir = ">=2.5"
reqwest = ">=0.13.3"
rdkafka = { version = ">=0.39", features = ["dynamic-linking"] }

[profile.release]
lto = "thin"             # hyperi-ci overrides to "fat" at beta+ channels
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
