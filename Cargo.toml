# Project:      dfe-archiver
# File:         Cargo.toml
# Purpose:      Workspace root for high-volume Kafka-to-storage archiver
# Language:     TOML
#
# License:      BUSL-1.1
# Copyright:    (c) 2026 HyperI Pty Ltd

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/io",
    "crates/archiver",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-archiver"
authors = ["HyperI Pty Ltd <engineering@hyperi.io>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"

[workspace.dependencies]
# Internal crates
dfe-archiver-core = { path = "crates/core" }
dfe-archiver-io = { path = "crates/io" }

# scalo data-plane runtime.
scalo = { version = ">=2.10.7, <3" }

# JSON Schema derivation for the reflectable config-schema capability
# (scalo-rs#6). Same version range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.1, <2", default-features = false, features = ["std", "derive", "preserve_order"] }

# Async runtime
tokio = { version = ">=1.50, <2", features = ["full", "parking_lot"] }
tokio-util = { version = ">=0.7, <0.8", features = ["time"] }

# Serialization
serde = { version = ">=1.0.228, <2", features = ["derive"] }
serde_json = ">=1.0.149, <2"
sonic-rs = ">=0.5.8, <0.6"

# Error handling
thiserror = ">=2.0, <3"
anyhow = ">=1.0.100"

# Compression
zstd = ">=0.13, <0.14"
lz4_flex = ">=0.13, <0.14"
snap = ">=1.1, <2"
flate2 = ">=1.1.9, <2"

# Cloud storage backends
object_store = { version = ">=0.14.0, <0.15", features = ["aws", "gcp", "azure"] }
aws-config = ">=1.8, <2"
# default-features off to drop the `rustls` feature, which is the legacy
# hyper-0.14 TLS backend and the only thing pulling rustls 0.21 -> the
# unmaintained rustls-webpki 0.101. Everything else in the default set is
# re-listed here; the modern TLS path is default-https-client (aws-lc).
aws-sdk-s3 = { version = ">=1.124, <2", default-features = false, features = [
    "default-https-client",
    "http-1x",
    "rt-tokio",
    "sigv4a",
] }

# Utilities
bytes = ">=1.11, <2"
chrono = { version = ">=0.4.44, <0.5", features = ["serde"] }
uuid = { version = ">=1.23, <2", features = ["v4", "serde"] }
parking_lot = ">=0.12, <0.13"
rayon = ">=1.12, <2"
dashmap = ">=6.1, <7"
compact_str = ">=0.9, <0.10"
rustc-hash = ">=2.1, <3"
smallvec = { version = ">=1.15, <2", features = ["union", "serde"] }
fs2 = ">=0.4, <0.5"
indexmap = ">=2.14, <3"
lru = ">=0.18.0, <0.19"
metrics = ">=0.24.4, <0.25"
percent-encoding = ">=2.3, <3"

# CLI
clap = { version = ">=4.6, <5", features = ["derive", "env"] }

# Tracing
tracing = ">=0.1.44, <0.2"
tracing-subscriber = { version = ">=0.3.23, <0.4", features = ["env-filter"] }

# Async utilities
async-trait = ">=0.1.89, <0.2"
futures = ">=0.3.32, <0.4"

# Config
dotenvy = ">=0.15, <0.16"
serde_yaml_ng = ">=0.10.0, <0.11"

# Allocators
tikv-jemallocator = ">=0.7.0, <0.8"

# Dev dependencies
tempfile = ">=3.27, <4"
criterion = { version = ">=0.8, <0.9", features = ["html_reports", "async_tokio"] }
proptest = ">=1.11, <2"
tokio-test = ">=0.4, <0.5"
test-log = { version = ">=0.2, <0.3", features = ["trace"] }
walkdir = ">=2.5, <3"
reqwest = ">=0.13.3, <0.14"
rdkafka = { version = ">=0.39, <0.40", features = ["dynamic-linking"] }

[profile.release]
lto = "thin"             # hyperi-ci overrides to "fat" at beta+ channels
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
