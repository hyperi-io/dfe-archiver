[advisories]
# Transitive rustls-webpki 0.101.7 vulnerabilities. Reachable only through
# the AWS SDK chain (aws-smithy-http-client → rustls 0.21 → rustls-webpki
# 0.101.7). Will clear when AWS SDK upgrades to rustls 0.23+. Tracked in
# TODO.md → Dependabot Alerts. None are reachable in our config:
#   - RUSTSEC-2026-0098 (DoS via CRL panic): we don't pass RevocationOptions
#     to verify_for_usage(), so the vulnerable code path is unreachable.
#   - RUSTSEC-2026-0099, -0104 (name-constraint corner cases): only relevant
#     to apps that delegate cert chain validation to webpki directly with
#     custom name constraints — AWS SDK does not.
ignore = [
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]

[licenses]
allow = [
    "FSL-1.1-ALv2",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
]

[[licenses.exceptions]]
allow = ["ISC", "MIT", "OpenSSL"]
name = "ring"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
