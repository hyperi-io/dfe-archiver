# Project:   dfe-archiver
# File:      deny.toml
# Purpose:   License and advisory scanning configuration
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is unmaintained, not vulnerable. It arrives only through the testcontainers dev-dependency the integration tests use, and no release binary links it. testcontainers 0.28.0 still depends on it. Drop when testcontainers moves off it." },
]

[licenses]
allow = [
    "BUSL-1.1",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # webpki-root-certs (bundled CA roots via reqwest/object_store) ships its
    # cert data under the permissive Community Data License Agreement.
    "CDLA-Permissive-2.0",
]

[[licenses.exceptions]]
allow = ["ISC", "MIT", "OpenSSL"]
name = "ring"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
