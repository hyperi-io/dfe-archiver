name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: "Tag to publish (e.g. v1.5.3)"

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    # Tier 2 (PGO + BOLT) contract: `@main` must be at hyperi-ci ≥ v1.12.1
    # (commit ba03ff0+) so HYPERCI_CHANNEL resolves correctly on tagged
    # dispatches; `publish-target: both` resolves to release channel
    # (Tier 2 unlocked). Loader Canary 2 confirmed both are required.
    # Pin to a specific commit if reproducibility outweighs tracking tip.
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@main
    with:
      publish-target: both
      tag: ${{ inputs.tag || '' }}
    secrets: inherit
