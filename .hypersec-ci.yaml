# HyperSec CI Configuration
# Generated by: attach.sh
# Documentation: https://github.com/hypersec-io/ci/blob/main/docs/CONFIGURATION.md
#
# Configuration precedence (highest wins):
#   1. Environment variables (HYPERCI_*)
#   2. This file (.hypersec-ci.yaml)
#   3. ci/defaults.yaml (CI defaults)

# Project language (auto-detected if not specified)
# Values: python, typescript, golang, rust, none
language: rust

# Runner settings (override GH_RUNNER_* variables)
# runners:
#   default: ubuntu-latest    # Default runner for all jobs (quality, test, build, publish)

# Quality checks
quality:
  enabled: true
  rust:
    fmt: blocking           # Formatting check (cargo fmt --check)
    clippy: blocking        # Linting (cargo clippy)
    audit: warn             # Security audit (cargo audit) - warn only
    deny: warn              # License/advisory check (cargo deny)
    # Feature sets to test with clippy (jemalloc and mimalloc are mutually exclusive)
    features:
      - "default"
      - "default,jemalloc"
      - "default,mimalloc"

# Testing
test:
  enabled: true
  coverage: true
  # min_coverage: 80       # Fail if coverage below this percentage
  rust:
    tier: all               # "unit", "integration", "e2e", or "all"
    # Feature sets to test (match quality.rust.features for consistency)
    features:
      - "default"
      - "default,jemalloc"
      - "default,mimalloc"

# Building
build:
  enabled: true
  strategies:
    - native
  rust:
    # Feature sets to build (production builds use jemalloc)
    features:
      - "default,jemalloc"

# Publishing (on release)
publish:
  enabled: true
  # binaries: both         # Binary publish destination: artifactory, github, both
  # binaries_repo: hypersec-binaries  # JFrog Generic repo for binaries
