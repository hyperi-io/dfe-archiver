# Project:      dfe-archiver
# File:         crates/io/Cargo.toml
# Purpose:      I/O layer - inbound transports and storage backends
# Language:     TOML
#
# License:      BUSL-1.1
# Copyright:    (c) 2026 HyperI Pty Ltd

[package]
name = "dfe-archiver-io"
version.workspace = true
description = "I/O layer for dfe-archiver: inbound transports and storage backends"
# An internal BUSL-1.1 crate with a registry-shaped name: never publishable.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
dfe-archiver-core = { workspace = true }
scalo = { workspace = true, features = ["transport-kafka", "transport-grpc", "metrics", "governor"] }
rdkafka = { workspace = true }

# Cloud storage
object_store = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Utilities
compact_str = { workspace = true }
tracing = { workspace = true }
percent-encoding = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = { workspace = true }

[features]
default = []
transport-memory = ["dfe-archiver-core/transport-memory"]
