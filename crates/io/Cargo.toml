# Project:      dfe-archiver
# File:         crates/io/Cargo.toml
# Purpose:      I/O layer - inbound transports and storage backends
# Language:     TOML
#
# License:      BUSL-1.1
# Copyright:    (c) 2026 HyperI Pty Ltd

[package]
name = "dfe-archiver-io"
version.workspace = true
description = "I/O layer for dfe-archiver: inbound transports and storage backends"
# An internal BUSL-1.1 crate with a registry-shaped name: never publishable.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
dfe-archiver-core = { workspace = true }
# The inbound menu is deliberately kafka + grpc and no more: `SourceTransport`
# has exactly those two arms and `validate_config` rejects every other name, so
# compiling scalo's file/pipe/http/memory backends in would add image
# weight for a `transport:` value the archiver refuses to boot on.
scalo = { workspace = true, features = ["transport-kafka", "transport-grpc", "metrics", "governor"] }

# Cloud storage
object_store = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Utilities
compact_str = { workspace = true }
tracing = { workspace = true }
percent-encoding = { workspace = true }
# The manifest a completed staged file carries, so a restart can upload it.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = { workspace = true }
# Builds the librdkafka statistics the position-lag unit test feeds to scalo.
rdkafka = { workspace = true }
# Read uploaded archive objects back with each codec's own decoder rather than
# the archiver's, to prove the objects are standard framed streams.
zstd = { workspace = true }
flate2 = { workspace = true }
lz4_flex = { workspace = true }
snap = { workspace = true }

[features]
default = []
transport-memory = ["dfe-archiver-core/transport-memory"]
