# Project:      dfe-archiver
# File:         crates/io/Cargo.toml
# Purpose:      I/O layer - Kafka transport and storage backends
# Language:     TOML
#
# License:      FSL-1.1-ALv2
# Copyright:    (c) 2026 HyperI Pty Ltd

[package]
name = "dfe-archiver-io"
version = "1.7.0"
description = "I/O layer for dfe-archiver: Kafka transport and storage backends"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
dfe-archiver-core = { workspace = true }
hyperi-rustlib = { workspace = true, features = ["transport-kafka", "metrics"] }
rdkafka = { workspace = true }

# Cloud storage
object_store = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Utilities
compact_str = { workspace = true }
tracing = { workspace = true }
percent-encoding = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = { workspace = true }

[features]
default = []
transport-memory = ["dfe-archiver-core/transport-memory"]
