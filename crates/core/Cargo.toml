# Project:      dfe-archiver
# File:         crates/core/Cargo.toml
# Purpose:      Core library - types, compression, buffering, routing, archive logic
# Language:     TOML
#
# License:      BUSL-1.1
# Copyright:    (c) 2026 HyperI Pty Ltd

[package]
name = "dfe-archiver-core"
version.workspace = true
description = "Core library for dfe-archiver: types, compression, buffering, routing"
# An internal BUSL-1.1 crate with a registry-shaped name: never publishable.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# dlq-kafka: the file backend is an EROFS no-op on the charts' read-only
# rootfs, so kafka is the only DLQ backend that works deployed.
scalo = { workspace = true, features = ["transport-kafka", "scaling", "dlq", "dlq-kafka", "config-schema"] }

# JSON Schema derivation for the reflectable config-schema capability (scalo-rs#6).
schemars = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
sonic-rs = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Compression
zstd = { workspace = true }
lz4_flex = { workspace = true }
snap = { workspace = true }
flate2 = { workspace = true }

# Utilities
bytes = { workspace = true }
chrono = { workspace = true }
compact_str = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }
fs2 = { workspace = true }
indexmap = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Tracing
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = { workspace = true }

[features]
default = []
transport-memory = ["scalo/transport-memory"]
