# Project:      dfe-archiver
# File:         crates/archiver/Cargo.toml
# Purpose:      Binary and orchestration for the archiver service
# Language:     TOML
#
# License:      BUSL-1.1
# Copyright:    (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-archiver"
version.workspace = true
description = "Writes a DFE deployment's streams to compressed files in a local path or object store."
# The service ships as a container image, never as a registry crate.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
exclude = [".github/", "ci/", "docs/", "reference/"]

[lib]
name = "dfe_archiver"
path = "src/lib.rs"

[[bin]]
name = "dfe-archiver"
path = "src/main.rs"

[[bin]]
name = "pgo-driver"
path = "src/bin/pgo_driver.rs"
required-features = ["pgo-driver"]

[lints]
workspace = true

[dependencies]
dfe-archiver-core = { workspace = true }
dfe-archiver-io = { workspace = true }
scalo = { workspace = true, features = [
    "config", "config-reload", "logger", "metrics", "service-metrics",
    # kafka and grpc are the only transports `validate_config` accepts.
    "transport-kafka", "transport-grpc", "http-server", "tiered-sink", "spool",
    # dlq-kafka: the file DLQ is a no-op on the charts' read-only rootfs.
    "scaling", "governor", "expression", "deployment", "config-schema", "cli-service", "memory", "health", "shutdown", "dlq", "dlq-kafka", "version-check",
] }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Config
clap = { workspace = true }
dotenvy = { workspace = true }

# Tracing
tracing = { workspace = true }

# Utilities
chrono = { workspace = true }
compact_str = { workspace = true }
lru = { workspace = true }
metrics = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
temp-env = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
tokio-test = { workspace = true }
test-log = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }
reqwest = { workspace = true }
rdkafka = { workspace = true }
testcontainers = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# The TLS broker the Kafka TLS test runs against.
scalo = { workspace = true, features = ["transport-kafka-test-support"] }
# Creates, lists and reads buckets on the at-least-once tests' S3 store, because
# object_store has no bucket API.
aws-sdk-s3 = { workspace = true }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
transport-memory = ["dfe-archiver-core/transport-memory"]
# The PGO workload driver (scripts/pgo-workload.sh).
pgo-driver = ["dep:rdkafka"]
full = ["jemalloc"]

[dependencies.tikv-jemallocator]
workspace = true
optional = true

[dependencies.tikv-jemalloc-ctl]
workspace = true
optional = true

[dependencies.rdkafka]
workspace = true
optional = true

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "compression"
harness = false
