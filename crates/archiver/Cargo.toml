# Project:      dfe-archiver
# File:         crates/archiver/Cargo.toml
# Purpose:      Binary and orchestration for the archiver service
# Language:     TOML
#
# License:      BUSL-1.1
# Copyright:    (c) 2026 HyperI Pty Ltd

[package]
name = "dfe-archiver"
version.workspace = true
description = "High-volume Kafka-to-storage archiver for PB/s scale data pipelines"
# The service ships as a container image, never as a registry crate.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
exclude = [".github/", "ci/", "docs/", "reference/"]

[lib]
name = "dfe_archiver"
path = "src/lib.rs"

[[bin]]
name = "dfe-archiver"
path = "src/main.rs"

[[bin]]
name = "pgo-driver"
path = "src/bin/pgo_driver.rs"
required-features = ["pgo-driver"]

[lints]
workspace = true

[dependencies]
dfe-archiver-core = { workspace = true }
dfe-archiver-io = { workspace = true }
scalo = { workspace = true, features = [
    "config", "config-reload", "logger", "metrics", "service-metrics",
    "transport-kafka", "transport-grpc", "http-server", "tiered-sink", "spool",
    # `scaling` exposes the unified ScalingPressure engine served at
    # /scaling/pressure; `governor` exposes the self-regulation inbound brake.
    # `expression` backs the CEL surface used by config/scaling tunables.
    # dlq-kafka: the file backend is an EROFS no-op on the charts' read-only
    # rootfs, so kafka is the only DLQ backend that works deployed.
    "scaling", "governor", "expression", "deployment", "config-schema", "cli-service", "memory", "health", "shutdown", "dlq", "dlq-kafka", "worker-pool", "version-check",
] }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Config
clap = { workspace = true }
dotenvy = { workspace = true }
serde_yaml_ng = { workspace = true }

# Tracing
tracing = { workspace = true }

# Utilities
chrono = { workspace = true }
compact_str = { workspace = true }
lru = { workspace = true }
metrics = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
temp-env = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
tokio-test = { workspace = true }
test-log = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }
reqwest = { workspace = true }
rdkafka = { workspace = true }
testcontainers = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
transport-memory = ["dfe-archiver-core/transport-memory"]
# Build the `pgo-driver` binary used by `scripts/pgo-workload.sh` to drive a
# representative workload during PGO instrumentation. Default builds skip it.
pgo-driver = ["dep:rdkafka"]
full = ["jemalloc"]

[dependencies.tikv-jemallocator]
workspace = true
optional = true

[dependencies.tikv-jemalloc-ctl]
workspace = true
optional = true

[dependencies.rdkafka]
workspace = true
optional = true

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "compression"
harness = false
