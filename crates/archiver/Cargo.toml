# Project:      dfe-archiver
# File:         crates/archiver/Cargo.toml
# Purpose:      Binary and orchestration for the archiver service
# Language:     TOML
#
# License:      BUSL-1.1
# Copyright:    (c) 2026 HyperI Pty Ltd

[package]
name = "dfe-archiver"
version = "1.7.3"
description = "High-volume Kafka-to-storage archiver for PB/s scale data pipelines"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
exclude = [".github/", "ci/", "docs/", "reference/"]

[lib]
name = "dfe_archiver"
path = "src/lib.rs"

[[bin]]
name = "dfe-archiver"
path = "src/main.rs"

[[bin]]
name = "pgo-driver"
path = "src/bin/pgo-driver.rs"
required-features = ["pgo-driver"]

[lints]
workspace = true

[dependencies]
dfe-archiver-core = { workspace = true }
dfe-archiver-io = { workspace = true }
hyperi-rustlib = { workspace = true, features = [
    "config", "config-reload", "logger", "metrics", "metrics-dfe",
    "transport-kafka", "http-server", "tiered-sink", "spool",
    # `expression` is REQUIRED for the ScalingEngine: it is gated on
    # `#[cfg(all(feature="scaling", feature="expression"))]`. cli-service does
    # NOT pull it, so without it the engine silently compiles out (no
    # scaling_pressure gauge, signals pushed to a cell nobody reads).
    "scaling", "expression", "deployment", "cli-service", "memory", "health", "shutdown", "dlq", "worker-pool",
] }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Config
clap = { workspace = true }
dotenvy = { workspace = true }
serde_yaml_ng = { workspace = true }

# Tracing
tracing = { workspace = true }

# Utilities
chrono = { workspace = true }
compact_str = { workspace = true }
lru = { workspace = true }
metrics = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
tokio-test = { workspace = true }
test-log = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }
reqwest = { workspace = true }
rdkafka = { workspace = true }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
transport-memory = ["dfe-archiver-core/transport-memory"]
# Build the `pgo-driver` binary used by `scripts/pgo-workload.sh` to drive a
# representative workload during PGO instrumentation. Default builds skip it.
pgo-driver = ["dep:rdkafka"]
full = ["jemalloc"]

[dependencies.tikv-jemallocator]
workspace = true
optional = true

[dependencies.rdkafka]
workspace = true
optional = true

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "compression"
harness = false
