# Copyright:    (c) 2026 HyperI Pty Ltd
#
# Usage:
#   docker compose -f docker-compose.dev.yaml up -d
#   docker compose -f docker-compose.dev.yaml down -v

services:
  # =========================================================================
  # Redpanda (Kafka-compatible, lighter weight)
  # =========================================================================
  redpanda:
    # Matches KAFKA_TAG in scripts/pgo-workload.sh. Two pins of the same image
    # on different majors makes Renovate track two lines and open a PR for each.
    # renovate: datasource=docker depName=redpandadata/redpanda
    image: redpandadata/redpanda:v26.2.2@sha256:468bd13a9f2bd24794cb7fddc867c767fb1008b9a07b297b89fde48c564d7d96
    container_name: archiver-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --default-log-level=warn
    ports:
      - "19092:19092"  # Kafka external
      - "18082:18082"  # Pandaproxy
      - "18081:18081"  # Schema registry
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redpanda Console (Kafka UI)
  redpanda-console:
    # renovate: datasource=docker depName=redpandadata/console
    image: redpandadata/console:v3.12.0@sha256:9dc0cd55db172c6be9c2ff8a51f33a14395f7675fa7fbc002c277f3b96115c27
    container_name: archiver-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081

  # =========================================================================
  # S3-compatible object storage (LocalStack), for the minio:// and s3://
  # destinations. It accepts any credentials, minioadmin included.
  # =========================================================================
  s3:
    # Same pin as LOCALSTACK_TAG in crates/archiver/tests/common/mod.rs. Stay on
    # the semver line: the CalVer tags need a licence token to start.
    # renovate: datasource=docker depName=localstack/localstack versioning=semver
    image: localstack/localstack:4.14@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    container_name: archiver-s3
    ports:
      - "9000:4566"   # S3 API, where config.dev.yaml and .env.example point
    environment:
      SERVICES: s3
    configs:
      - source: s3-buckets
        target: /etc/localstack/init/ready.d/buckets.sh
        mode: 0755
    healthcheck:
      # Healthy once the bucket script has run, not merely once S3 answers.
      test: ["CMD-SHELL", "curl -s http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Local file storage (for file:// backend testing)
  # =========================================================================
  # No container needed - uses ./data/archive volume mount

volumes:
  redpanda-data:

configs:
  s3-buckets:
    content: |
      #!/bin/sh
      awslocal s3 mb s3://archive
      awslocal s3 mb s3://archive-test

# =========================================================================
# Network
# =========================================================================
networks:
  default:
    name: archiver-network
