# Project:      dfe-archiver
# File:         docker-compose.dev.yaml
# Purpose:      Local development environment with Kafka, MinIO, and test storage
# Language:     YAML
#
# License:      BUSL-1.1
# Copyright:    (c) 2026 HyperI Pty Ltd
#
# Usage:
#   docker compose -f docker-compose.dev.yaml up -d
#   docker compose -f docker-compose.dev.yaml down -v

services:
  # =========================================================================
  # Redpanda (Kafka-compatible, lighter weight)
  # =========================================================================
  redpanda:
    # Matches KAFKA_TAG in scripts/pgo-workload.sh. Two pins of the same image
    # on different majors makes Renovate track two lines and open a PR for each.
    # renovate: datasource=docker depName=redpandadata/redpanda
    image: redpandadata/redpanda:v26.2.1
    container_name: archiver-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --default-log-level=warn
    ports:
      - "19092:19092"  # Kafka external
      - "18082:18082"  # Pandaproxy
      - "18081:18081"  # Schema registry
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redpanda Console (Kafka UI)
  redpanda-console:
    # renovate: datasource=docker depName=redpandadata/console
    image: redpandadata/console:v3.9.0
    container_name: archiver-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081

  # =========================================================================
  # MinIO (S3-compatible object storage)
  # =========================================================================
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: archiver-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO bucket initialisation
  minio-init:
    image: minio/mc:RELEASE.2024-01-18T07-03-39Z
    container_name: archiver-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/archive;
      mc mb --ignore-existing local/archive-test;
      mc anonymous set download local/archive-test;
      echo 'MinIO buckets created';
      "

  # =========================================================================
  # Local file storage (for file:// backend testing)
  # =========================================================================
  # No container needed - uses ./data/archive volume mount

volumes:
  redpanda-data:
  minio-data:

# =========================================================================
# Network
# =========================================================================
networks:
  default:
    name: archiver-network
